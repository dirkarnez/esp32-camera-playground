name: Build
on:
  push:
    branches:
    - main
    
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
    contents: write
    
jobs:
  build-examples:
    name: Build for ${{ matrix.idf_target }} on ${{ matrix.idf_ver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_ver: ["release-v5.1", "release-v5.2", "release-v5.3", "release-v5.4", "release-v5.5", "release-v6.0", "latest"]
        idf_target: ["esp32", "esp32s2", "esp32s3", "esp32c2", "esp32c3"]
    container: espressif/idf:${{ matrix.idf_ver }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: 'true'
      - name: esp-idf build
        env:
          IDF_TARGET: ${{ matrix.idf_target }}
        shell: bash
        run: |
          . ${IDF_PATH}/export.sh
          export PEDANTIC_FLAGS="-DIDF_CI_BUILD -Werror -Werror=deprecated-declarations -Werror=unused-variable -Werror=unused-but-set-variable -Werror=unused-function"
          export EXTRA_CFLAGS="${PEDANTIC_FLAGS} -Wstrict-prototypes"
          export EXTRA_CXXFLAGS="${PEDANTIC_FLAGS}"
          idf.py set-target ${{ matrix.idf_target }} && \
          idf.py fullclean && \
          idf.py build

      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          directory: build
          filename: "${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.idf_ver }}-${{ matrix.idf_target }}.zip"
          
      - name: Release prebuilt
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.idf_ver }}-${{ matrix.idf_target }}.zip"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
